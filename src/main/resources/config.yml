# MCDiag Agent
# Адрес приёма телеметрии. Только HTTPS — http:// отклоняется, отправка не запускается.
backend_url: "https://mcdiag.rimworlda.ru/api/v1/ingest"

# Токен сервера из панели MCDiag (показывается один раз).
# Безопаснее задать из консоли: diag token <value> — из чата команда запрещена.
server_token: ""

# Соль для SHA-256 хеша UUID игроков. Пусто — сгенерируется при первом запуске.
# Не меняйте после запуска: игроки получат новые хеши, сломается статистика удержания.
uuid_salt: ""

# Интервал отправки батча, сек (минимум 5: бэкенд принимает не чаще 1 запроса в 3 с).
batch_interval_sec: 10

# Максимум событий в памяти. При переполнении вытесняются самые старые.
max_buffer_size: 500

# Максимум событий в одном батче (бэкенд: ≤ 500 и ≤ 64 KB на запрос).
max_batch_events: 100

# Интервал снятия метрик TPS/MSPT/online/entities, сек (5..60).
metrics_interval_sec: 5

# Защита от лавины ошибок: остальные SEVERE за минуту отбрасываются.
max_errors_per_minute: 30

collect:
  joins: true
  quits: true
  deaths: true
  errors: true
  metrics: true

# Профилировщик плагинов (как spark): снимает стек главного потока и считает, сколько времени тика
# уходит в каждый плагин. Работает в отдельном потоке. Пока сервер ждёт следующего тика, стек не снимается.
profiler:
  enabled: true
  # Обычный интервал сэмплов: в среднем раз в 50 мс, значение больше 50 делает их реже.
  # Если снимки стека занимают больше 0,5% времени (в долгом тике 2%), агент сам снижает частоту.
  interval_ms: 20
  # Тики дольше этого порога (мс) сохраняются как лаг-спайки вместе с виновниками.
  spike_threshold_ms: 100
  # Учитывать CPU асинхронных потоков плагинов (планировщик Paper, пулы).
  async: true
  # Прикладывать к лаг-спайку предупреждения и ошибки плагинов за минуту до него.
  spike_logs: true
  # Интервал сэмплов внутри затянувшегося тика, мс (2..50): чем меньше, тем подробнее лаг-спайки.
  spike_interval_ms: 5
  # JFR, встроенный в Java: причины спайков и кто выделяет память. Без остановок JVM, около 0,3% ядра.
  # Если JFR нет или он тратит больше 3% ядра, агент выключит его сам и продолжит работу.
  jfr: true

# Журнал команд игроков. Включается владельцем на сайте (Настройки сервера), по умолчанию выключен.
# Пароли и личные сообщения скрываются здесь же, до отправки.
chat_log:
  # false — запретить журнал на этом сервере, что бы ни было выбрано на сайте.
  allowed: true
  # Дополнительные команды, у которых нужно скрывать аргументы (встроены /login, /register, /msg, /tell и т. п.).
  hidden_commands: []
