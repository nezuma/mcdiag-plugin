# MCDiag Agent
# Адрес приёма телеметрии. Только HTTPS — http:// отклоняется, отправка не запускается.
backend_url: "https://mcdiag.rimworlda.ru/api/v1/ingest"

# Токен сервера из панели MCDiag (показывается один раз).
# Безопаснее задать из консоли: diag token <value> — из чата команда запрещена.
server_token: ""

# Соль для SHA-256 хеша UUID игроков. Пусто — сгенерируется при первом запуске.
# Хеш связывает заходы одного игрока для удержания; ник отправляется рядом и виден в панели.
# Не меняйте после запуска: игроки получат новые хеши, сломается статистика удержания.
uuid_salt: ""

# Интервал отправки батча, сек (минимум 5: бэкенд принимает не чаще 1 запроса в 3 с).
batch_interval_sec: 10

# Максимум событий в памяти. При переполнении вытесняются самые старые.
max_buffer_size: 500

# Максимум событий в одном батче (бэкенд: ≤ 500 и ≤ 64 KB на запрос).
max_batch_events: 100

# Интервал снятия метрик TPS/MSPT/online/entities, сек (5..60).
metrics_interval_sec: 5

# Защита от лавины ошибок для старой панели (события error): остальные SEVERE за минуту отбрасываются.
# Новый журнал (modules.logs) группирует повторы сам и этим лимитом не ограничен.
max_errors_per_minute: 30

# Модули агента. Каждый включается, только если панель его поддерживает; /diag modules — состояние.
# Сторонние плагины могут добавлять свои модули через API (mcdiag-api.jar, см. README).
modules:
  # Все предупреждения и ошибки сервера и плагинов (Log4j: SLF4J, System.err, сообщения ядра),
  # сгруппированные по проблеме. Серьёзность и влияние показывает панель.
  logs:
    enabled: true
    # WARN — предупреждения и ошибки, ERROR — только ошибки.
    min_level: WARN
  # Куда ходят плагины: хост, путь и параметры (секреты скрыты), частота, место вызова, главный поток.
  network:
    enabled: true
    # Путь и параметры запросов, место вызова в коде и файл плагина. Видны только владельцу и администраторам.
    paths: true
    # Дополнительные параметры, значения которых скрывать (к встроенным token, key, secret, password, auth…).
    mask_params: []
  # Выдача OP и опасных прав: команды, журнал LuckPerms, права, выданные плагинами в обход команд.
  privileges:
    enabled: true
    # Дополнительные права, выдачу которых считать опасной (к встроенным *, luckperms.*, плагин.* и т. п.).
    dangerous_permissions: []
  # Защита сервера: проверка jar-файлов плагинов (опасные вызовы, вебхуки, обфускация, заражение),
  # изменения в папке plugins, дочерние процессы сервера и аудит настроек. Ничего не блокирует —
  # только предупреждения в панели. Проверка идёт в фоне на одном потоке с низким приоритетом.
  guard:
    enabled: true
    scan_plugins: true
    watch_plugins: true
    processes: true
    config_audit: true

collect:
  joins: true
  quits: true
  deaths: true
  errors: true
  metrics: true
  # Сколько чанков сервер сгенерировал впервые: генерация во время игры роняет TPS.
  chunks: true
  # IP игрока и адрес, по которому он зашёл (домен или IP): аналитика заходов на сайте.
  # За прокси без проброса IP (Velocity forwarding, BungeeCord ip_forward) виден адрес прокси.
  join_source: true

# Профилировщик плагинов (как spark): снимает стек главного потока и считает, сколько времени тика
# уходит в каждый плагин. Работает в отдельном потоке. Пока сервер ждёт следующего тика, стек не снимается.
profiler:
  enabled: true
  # Обычный интервал сэмплов: в среднем раз в 50 мс, значение больше 50 делает их реже.
  # Если снимки стека занимают больше 0,5% времени (в долгом тике 2%), агент сам снижает частоту.
  interval_ms: 20
  # Тики дольше этого порога (мс) сохраняются как лаг-спайки вместе с виновниками.
  spike_threshold_ms: 100
  # Учитывать CPU асинхронных потоков плагинов (планировщик Paper, пулы).
  async: true
  # Прикладывать к лаг-спайку предупреждения и ошибки плагинов за минуту до него.
  spike_logs: true
  # Интервал сэмплов внутри затянувшегося тика, мс (2..50): чем меньше, тем подробнее лаг-спайки.
  spike_interval_ms: 5
  # JFR, встроенный в Java: причины спайков и кто выделяет память. Без остановок JVM, около 0,3% ядра.
  # Если JFR нет или он тратит больше 3% ядра, агент выключит его сам и продолжит работу.
  jfr: true

# Журнал чата и команд игроков. Чат и команды включаются владельцем на сайте (Настройки сервера),
# по умолчанию оба выключены. Пароли, личные сообщения, токены и IP скрываются здесь же, до отправки.
chat_log:
  # false — запретить журнал на этом сервере, что бы ни было выбрано на сайте.
  allowed: true
  # Дополнительные команды, у которых нужно скрывать аргументы (встроены /login, /register, /msg, /tell и т. п.).
  hidden_commands: []

# Экономика: балансы игроков онлайн раз в 5 минут, порциями по 50 игроков за тик.
# Валюта находится сама: Vault (EssentialsX, CMI и другие) и PlayerPoints. Зависимостей в jar нет.
economy:
  enabled: true
  # Раз в 6 часов читать и игроков офлайн, заходивших за 30 дней (до 2000). У части плагинов валюты
  # это запрос к базе или диску, поэтому по умолчанию выключено.
  offline_players: false

# Тепловая карта спавна и конверсия. Включается командой /diag heatmap on.
# Пока выключено или зона не задана, модуля нет: ни слушателей, ни задач.
# Зона и POI задаются в игре: /diag pos1, /diag pos2, /diag poi <имя>.
heatmap:
  enabled: false
  # Считать игроков с правом mcdiag.admin. Обычно нет: администраторы искажают конверсию.
  count_admins: false
